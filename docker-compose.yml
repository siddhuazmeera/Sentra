services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentra-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentra-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
